name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ["18", "20", "22"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npm test
      - name: Package contents
        run: npm pack --dry-run

  # Real pusher-js clients against a Pusher-compatible server with client
  # events on. The same test runs against Hibira with YJS_E2E_* set.
  e2e:
    runs-on: ubuntu-latest
    services:
      soketi:
        image: quay.io/soketi/soketi:1.6-16-debian
        ports:
          - 6001:6001
        env:
          SOKETI_DEFAULT_APP_ID: yjs
          SOKETI_DEFAULT_APP_KEY: yjs-key
          SOKETI_DEFAULT_APP_SECRET: yjs-secret-0123456789
          SOKETI_DEFAULT_APP_ENABLE_CLIENT_MESSAGES: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - name: Wait for the server
        run: for i in $(seq 30); do curl -sf http://127.0.0.1:6001/ && break; sleep 1; done
      - run: npm run test:e2e
        env:
          YJS_E2E_APP_ID: yjs
          YJS_E2E_KEY: yjs-key
          YJS_E2E_SECRET: yjs-secret-0123456789
          YJS_E2E_PORT: "6001"
